name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  # The vault lives in a separate repo as the content/ submodule. This schedule
  # lets a plain `git push` in the vault publish on its own: the build below
  # always pulls the vault's newest commit, so no pointer bump is required.
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # ...or trigger it by hand for an immediate rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history so git-based dates work
          submodules: recursive # content/ is a submodule of the vault repo
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Always publish the vault's newest commit, not the pinned pointer. This is
      # what makes a vault-only push enough to update the site.
      - name: Update content to latest vault commit
        run: git submodule update --remote --recursive content
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      # Proves what `check-site.mjs` counts as a "page" still holds. ~0.1s, no build needed,
      # so it fails fast. Guards a specific mistake: `pages` was once a raw .html count, which
      # reads 693 on Windows and 1269 here for the same site, because Quartz emits an
      # original-case redirect stub per note and NTFS collapses each pair. A baseline taken on
      # either machine then looked like a 45% regression on the other. See .kiro/traps.md T9.
      - name: Test what check-site counts
        run: node tools/test-check-site.mjs
      - name: Build Quartz
        run: npx quartz build
      # The Excalidraw pages are the heaviest thing published (4-6.8 MB each). This
      # rounds coordinates in the large inline SVGs to integers, which is invisible on
      # canvases thousands of units across and takes the site from ~105 MB to ~90 MB.
      # It refuses to touch small-canvas or viewBox-less SVGs, and fails the build if a
      # drawing's structure would change. Remove this step and tools/slim-svg.mjs to
      # revert; nothing else depends on it.
      - name: Slim Excalidraw SVGs
        run: node tools/slim-svg.mjs public 0
      # Verify the artifact before it goes live. Fails on raw flashcard syntax leaking
      # into visible text, images without alt, KaTeX errors, a new broken internal link,
      # or any count falling more than 5% below site-baseline.json. Counts may grow
      # freely - only shrinkage is suspicious, which is what catches a transformer
      # silently stopping work. Re-baseline intentional changes with:
      #   node tools/check-site.mjs public --update
      - name: Check the built site
        run: node tools/check-site.mjs public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
