name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  # The vault lives in a separate repo as the content/ submodule. This schedule
  # lets a plain `git push` in the vault publish on its own: the build below
  # always pulls the vault's newest commit, so no pointer bump is required.
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: # ...or trigger it by hand for an immediate rebuild

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history so git-based dates work
          submodules: recursive # content/ is a submodule of the vault repo
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Always publish the vault's newest commit, not the pinned pointer. This is
      # what makes a vault-only push enough to update the site.
      - name: Update content to latest vault commit
        run: git submodule update --remote --recursive content
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build
      # The Excalidraw pages are the heaviest thing published (4-6.8 MB each). This
      # rounds coordinates in the large inline SVGs to integers, which is invisible on
      # canvases thousands of units across and takes the site from ~105 MB to ~90 MB.
      # It refuses to touch small-canvas or viewBox-less SVGs, and fails the build if a
      # drawing's structure would change. Remove this step and tools/slim-svg.mjs to
      # revert; nothing else depends on it.
      - name: Slim Excalidraw SVGs
        run: node tools/slim-svg.mjs public 0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
